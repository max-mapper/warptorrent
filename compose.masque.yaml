# WARP over MASQUE (HTTP/3 / QUIC on UDP 443), run by usque. Looks like ordinary HTTP/3
# traffic to Cloudflare on the wire. The kill switch is our own entrypoint: it installs a
# default-drop firewall and removes the non-tunnel default route BEFORE starting usque.
services:
  tunnel:
    build: ./tunnel-masque
    image: warptorrent-masque
    container_name: warptorrent-tunnel
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"   # IPv4 only; ip6tables also drops everything
    environment:
      STREAM_PORT: ${STREAM_PORT:-8888}
    volumes:
      - ./config/usque.json:/config/usque.json   # generated by scripts/setup-masque.sh (secret)
    ports:
      - "127.0.0.1:${STREAM_PORT:-8888}:${STREAM_PORT:-8888}"   # stream URL, this computer only
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 2
    labels:
      warptorrent.mode: masque
    restart: "no"   # started/stopped by ./warptorrent; never comes back on its own
