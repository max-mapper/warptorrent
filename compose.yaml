# warptorrent: WebTorrent whose ONLY network path is a Cloudflare WARP tunnel.
#
# This file holds the torrent client. The `tunnel` service comes from exactly one of:
#   compose.wireguard.yaml  WARP over WireGuard (gluetun)            ./warptorrent …
#   compose.masque.yaml     WARP over MASQUE / HTTP/3 (usque)        ./warptorrent --masque …
#
# Kill switch model: the torrent container has no network stack of its own. It shares the
# tunnel container's namespace (network_mode: service:tunnel), where a default-drop firewall
# allows only (a) traffic on the tunnel interface, (b) the single WARP endpoint, and (c) the
# stream port, from the Docker bridge only. If the tunnel drops, packets have nowhere to go.
# If the tunnel container dies, the namespace disappears and the client has no network at all.

services:
  torrent:
    build: ./torrent
    image: warptorrent-client
    container_name: warptorrent-client
    network_mode: "service:tunnel"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # files land owned by you, not root
    environment:
      TORRENT_ID: ${TORRENT_ID:-}
      STREAM: ${STREAM:-0}
      STREAM_PORT: ${STREAM_PORT:-8888}
    volumes:
      - ${OUTPUT_DIR:-./downloads}:/downloads   # bind mount: the only host path the client can touch
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
