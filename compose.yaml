# warptorrent: WebTorrent whose ONLY network path is a Cloudflare WARP tunnel.
#
# Two services:
#   tunnel   ./tunnel, the reusable warp-tunnel image. WARP over WireGuard (default) or over
#            MASQUE / HTTP/3 (./warptorrent --masque), picked by WARP_MODE.
#   torrent  the WebTorrent client.
#
# Kill switch model: the torrent container has no network stack of its own. It shares the
# tunnel container's namespace (network_mode: service:tunnel), where a default-drop firewall
# allows only (a) traffic on the tunnel interface, (b) the single WARP endpoint, and (c) the
# stream port, from the Docker bridge only. If the tunnel drops, packets have nowhere to go.
# If the tunnel container dies, the namespace disappears and the client has no network at all.

services:
  tunnel:
    build: ./tunnel
    image: warptorrent-tunnel
    container_name: warptorrent-tunnel
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"   # IPv4 only; the firewall also drops all IPv6
    environment:
      WARP_MODE: ${WARP_MODE:-wireguard}
      BRIDGE_TCP_PORTS: ${STREAM_PORT:-8888}   # stream server, reachable from the Docker bridge only
    volumes:
      - ./config:/config   # WARP device keys, written by `register` (secret)
    ports:
      - "127.0.0.1:${STREAM_PORT:-8888}:${STREAM_PORT:-8888}"   # stream URL, this computer only
    labels:
      warptorrent.mode: ${WARP_MODE:-wireguard}
    restart: "no"   # started/stopped by ./warptorrent; never comes back on its own

  torrent:
    build: ./torrent
    image: warptorrent-client
    container_name: warptorrent-client
    network_mode: "service:tunnel"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # files land owned by you, not root
    environment:
      TORRENT_ID: ${TORRENT_ID:-}
      STREAM: ${STREAM:-0}
      STREAM_PORT: ${STREAM_PORT:-8888}
    volumes:
      - ${OUTPUT_DIR:-./downloads}:/downloads   # bind mount: the only host path the client can touch
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
