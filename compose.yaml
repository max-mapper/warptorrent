# warptorrent: WebTorrent whose ONLY network path is a Cloudflare WARP WireGuard tunnel.
#
# Kill switch model: the `torrent` container has no network stack of its own. It shares
# gluetun's namespace (network_mode: service:gluetun), where gluetun's iptables policy
# drops everything except (a) traffic on the tun0 tunnel and (b) UDP to the single WARP
# endpoint. If the tunnel drops, packets have nowhere to go. If gluetun itself dies, the
# namespace disappears and the torrent container is left with no network at all.

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: warptorrent-gluetun
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    env_file: ./config/warp.env        # generated by scripts/setup-warp.sh (secret: private key)
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_MTU: "1280"            # WARP's MTU
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 25s
      WIREGUARD_ALLOWED_IPS: 0.0.0.0/0 # IPv4 only; IPv6 is dropped by gluetun's firewall
      DNS_UPSTREAM_RESOLVERS: cloudflare   # 1.1.1.1 over DNS-over-TLS, inside the tunnel
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      FIREWALL_OUTBOUND_SUBNETS: ""    # no LAN access from the torrent namespace
      FIREWALL_INPUT_PORTS: ""
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"  # only reachable inside the namespace (not published)
      TZ: UTC
    restart: unless-stopped
    # No `ports:` on purpose. Nothing is published to the host or LAN.

  torrent:
    build: ./torrent
    container_name: warptorrent-client
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # files land owned by you, not root
    environment:
      TORRENT_ID: ${TORRENT_ID:-}
      EXIT_WHEN_DONE: ${EXIT_WHEN_DONE:-1}
    volumes:
      - ${OUTPUT_DIR:-./downloads}:/downloads   # bind mount: the only host path the client can touch
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
