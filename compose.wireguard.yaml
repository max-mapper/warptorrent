# WARP over WireGuard (UDP 162.159.192.1:2408), run by gluetun. gluetun's iptables policy is
# the kill switch: OUTPUT DROP except tun0, the WARP endpoint, and the Docker bridge.
services:
  tunnel:
    image: qmcgaw/gluetun:v3.41.3
    container_name: warptorrent-tunnel
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    env_file: ./config/warp.env        # generated by scripts/setup-warp.sh (secret: private key)
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_MTU: "1280"            # WARP's MTU
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 25s
      WIREGUARD_ALLOWED_IPS: 0.0.0.0/0 # IPv4 only; IPv6 is dropped by gluetun's firewall
      DNS_UPSTREAM_RESOLVERS: cloudflare   # 1.1.1.1 over DNS-over-TLS, inside the tunnel
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      FIREWALL_OUTBOUND_SUBNETS: ""    # no LAN access from the torrent namespace
      FIREWALL_INPUT_PORTS: ${STREAM_PORT:-8888}   # stream server, reachable from the Docker bridge only
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"  # not published
      TZ: UTC
    ports:
      - "127.0.0.1:${STREAM_PORT:-8888}:${STREAM_PORT:-8888}"   # stream URL, this computer only
    labels:
      warptorrent.mode: wireguard
    restart: "no"   # started/stopped by ./warptorrent; never comes back on its own
